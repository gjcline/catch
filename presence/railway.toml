#
# Railway service root directory must be `presence` (this folder).
# PORT is injected by Railway. PRESENCE_MAX defaults to 80.

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "node src/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
